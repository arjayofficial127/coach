<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080b" />
    <meta
      name="description"
      content="Coach Browser brings scattered tabs, notes, reading, and next actions into one focused workspace."
    />
    <link rel="icon" type="image/svg+xml" href="/coach-mark.svg" />
    <title>Coach Browser — Your work, finally in one flow</title>
    <style>
      .file-preview-message {
        display: none;
      }

      html.file-preview {
        color-scheme: dark;
        background: #08080b;
      }

      html.file-preview body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 70% 20%, rgba(142, 121, 255, 0.18), transparent 34rem),
          radial-gradient(circle at 20% 80%, rgba(106, 217, 255, 0.08), transparent 30rem),
          #08080b;
        color: #f6f5fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html.file-preview .file-preview-message {
        display: grid;
        min-height: 100vh;
        place-content: center;
        justify-items: center;
        padding: 32px;
        text-align: center;
      }

      .file-preview-mark {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      .file-preview-mark svg {
        width: 49px;
      }

      .file-preview-message span {
        margin-top: 28px;
        color: #b5a8ff;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .file-preview-message h1 {
        max-width: 720px;
        margin: 14px 0;
        font-size: clamp(38px, 6vw, 70px);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .file-preview-message p {
        max-width: 560px;
        margin: 0;
        color: #a6a2b3;
        font-size: 16px;
        line-height: 1.65;
      }

      .file-preview-command {
        margin-top: 28px;
        border: 1px solid rgba(181, 168, 255, 0.35);
        border-radius: 14px;
        background: rgba(142, 121, 255, 0.12);
        padding: 15px 20px;
        color: #eeeaff;
        font-family: Consolas, monospace;
        font-size: 13px;
      }
    </style>
    <script>
      if (window.location.protocol === "file:") {
        document.documentElement.classList.add("file-preview");
      }
    </script>
  </head>
  <body>
    <div id="root">
      <main class="file-preview-message">
        <div class="file-preview-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round">
            <title>Coach Browser cap</title>
            <path d="M5.2 20.3C3.9 16.2 4 11.7 6.1 8.1C8.3 4.4 12.4 3.3 17.2 3.8C20.5 4.1 22.7 5 23.4 7.4L25.4 14.6"></path>
            <path d="M5.2 20.3C10.8 18 17.6 16 25.4 14.6L29.2 17.5C30.7 18.6 30.9 20.7 29.8 22.2C28.9 23.4 27.5 23.6 26.3 22.7L23.7 20.7C20.3 22.8 17.5 25.1 14.3 24.8C10.7 24.4 7.7 22.5 5.2 20.3Z"></path>
            <path d="M23.7 20.7C25.1 19.8 26.3 19 27.5 18.4C28.2 18 28.9 18.3 29.4 18.9"></path>
            <path d="M6.1 8.1C3.6 8.5 1.8 10.4 1.2 13.4C.7 15.7 1 18.2 1.6 20.4H5.2"></path>
          </svg>
        </div>
        <span>The site is ready</span>
        <h1>One tiny detour from the future.</h1>
        <p>
          This is a Vite application, so it needs its local preview server instead of opening the
          source HTML directly.
        </p>
        <div class="file-preview-command">Double-click OPEN-WEBSITE.cmd</div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
